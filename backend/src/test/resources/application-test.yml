spring:
  datasource:
    url: jdbc:h2:mem:campusone-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: test-only-secret-value-that-is-long-enough-for-hs256-0123456789
    ttl-minutes: 60
  demo:
    admin-password: Campus@2026
    faculty-password: Faculty@2026
  attendance:
    threshold-percent: 75
    max-backfill-days: 14
logging:
  level:
    root: WARN
    com.campusone: INFO
